name: Scheduled emails
# Wakes the app every 5 minutes so any email scheduled in Admin → Scheduled Emails
# goes out within a few minutes of its time. Needs repo secrets APP_URL
# (e.g. https://pcc.aneesatalks.com) and CRON_SECRET (same value as the Vercel env var).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Send any due scheduled emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          # Do nothing (and stay green) until both secrets are configured.
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET / APP_URL not set yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/webhooks/scheduled-emails"
